<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پیرسینگ ابرو استیل | ELORA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0c;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px;
      border-bottom: 1px solid #292929;
      text-align: center;
    }

    .logo {
      color: #d4b06a;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .back {
      display: inline-block;
      margin-top: 15px;
      color: #c9c9cc;
      text-decoration: none;
      font-size: 14px;
    }

    .product {
      max-width: 900px;
      margin: 50px auto;
      padding: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      align-items: center;
    }

    .product-image {
      height: 430px;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 18px;
    }

    .category {
      color: #d4b06a;
      font-size: 13px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 18px;
    }

    .description {
      color: #aaa;
      line-height: 2;
      margin-bottom: 25px;
    }

    .price {
      color: #d4b06a;
      font-size: 25px;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .buy-button {
      display: block;
      width: 100%;
      padding: 16px;
      background: #d4b06a;
      color: #0b0b0c;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .buy-button:hover {
      opacity: 0.85;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
      border-top: 1px solid #292929;
      margin-top: 40px;
    }

    @media (max-width: 700px) {
      .product {
        grid-template-columns: 1fr;
        margin: 25px auto;
      }

      .product-image {
        height: 350px;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">ELORA</div>

    <a href="/ELORA-/products.html" class="back">
      ← بازگشت به محصولات
    </a>
  </header>

  <main class="product">

    <div class="product-image">
      تصویر محصول
    </div>

    <div>
      <div class="category">ELORA COLLECTION</div>

      <h1>پیرسینگ ابرو استیل</h1>

      <p class="description">
        پیرسینگ ابرو استیل با طراحی ظریف و مینیمال،
        مناسب برای استایل‌های روزمره و خاص.
      </p>

      <div class="price">
        ۱۵۸,۰۰۰ تومان
      </div>

      <a href="#" class="buy-button">
        افزودن به سبد خرید
      </a>
    </div>

  </main>

  <footer>
    © 2026 ELORA — All Rights Reserved
  </footer>

</body>
      </html>
