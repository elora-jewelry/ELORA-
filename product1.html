<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیرسینگ ابرو استیل | ELORA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
    }

    header {
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 30px;
      letter-spacing: 6px;
      color: #d4af37;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .product {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: start;
    }

    .product-images {
      display: grid;
      gap: 15px;
    }

    .product-images img {
      width: 100%;
      display: block;
      border-radius: 14px;
      border: 1px solid #333;
      background: #151515;
    }

    .product-info {
      padding: 10px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 20px;
    }

    .description {
      color: #bbb;
      line-height: 2;
      margin-bottom: 25px;
    }

    .price {
      color: #d4af37;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .cart-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #d4af37;
      color: #111;
      text-decoration: none;
      text-align: center;
      border-radius: 10px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .cart-btn:hover {
      opacity: 0.9;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      color: #aaa;
      text-decoration: none;
    }

    @media (max-width: 700px) {
      .product {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">ELORA</div>
  </header>

  <main class="container">

    <div class="product">

      <div class="product-images">

        <img
          src="./35a1d3b653675da27e49c81de4bebe57.jpg"
          alt="پیرسینگ ابرو استیل"
        >

        <img
          src="./14b309daf8f51a81352d59bdc787a5d5.jpg"
          alt="پیرسینگ ابرو استیل"
        >

        <img
          src="./18a9b1742c0bfb928396b7c7f8009182.jpg"
          alt="پیرسینگ ابرو استیل"
        >

      </div>

      <div class="product-info">

        <h1>پیرسینگ ابرو استیل</h1>

        <p class="description">
          پیرسینگ ابرو استیل با طراحی ظریف و مینیمال،
          مناسب برای استایل‌های خاص و مدرن.
        </p>

        <div class="price">
          ۱۵۸,۰۰۰ تومان
        </div>

        <button class="cart-btn" onclick="addToCart()">
          افزودن به سبد خرید
        </button>

        <a class="back" href="/ELORA-/products.html">
          ← بازگشت به محصولات
        </a>

      </div>

    </div>

  </main>

  <script>
    function addToCart() {

      let cart = JSON.parse(localStorage.getItem("eloraCart")) || [];

      let product = {
        name: "پیرسینگ ابرو استیل",
        price: 158000,
        image: "./35a1d3b653675da27e49c81de4bebe57.jpg",
        quantity: 1
      };

      let existing = cart.find(
        item => item.name === product.name
      );

      if (existing) {
        existing.quantity++;
      } else {
        cart.push(product);
      }

      localStorage.setItem(
        "eloraCart",
        JSON.stringify(cart)
      );

      window.location.href = "/ELORA-/cart.html";
    }
  </script>

</body>
</html>
