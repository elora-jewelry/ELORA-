<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سفارش موفق | ELORA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
    }

    .box {
      width: 90%;
      max-width: 520px;
      text-align: center;
      padding: 45px 25px;
      background: #151515;
      border: 1px solid #333;
      border-radius: 14px;
    }

    .check {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      color: #d4af37;
      margin-bottom: 20px;
    }

    p {
      line-height: 2;
      color: #ddd;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: #d4af37;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="check">✓</div>

    <h1>سفارش شما با موفقیت ثبت شد ✨</h1>

    <p>
      اطلاعات سفارش شما دریافت شد.<br>
      ممنون که ELORA رو انتخاب کردید 🖤
    </p>

    <a href="/ELORA-/" class="btn">
      بازگشت به فروشگاه
    </a>

  </div>

</body>
</html>
