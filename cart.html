<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید | ELORA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
    }

    header {
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 30px;
      letter-spacing: 6px;
      color: #d4af37;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 35px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 60px 20px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #121212;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .cart-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
    }

    .item-info {
      flex: 1;
    }

    .item-info h3 {
      margin-bottom: 8px;
    }

    .item-price {
      color: #d4af37;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border: 1px solid #555;
      background: #1b1b1b;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    .remove {
      color: #aaa;
      background: none;
      border: none;
      cursor: pointer;
    }

    .total {
      margin-top: 30px;
      padding: 25px;
      background: #121212;
      border: 1px solid #292929;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-price {
      color: #d4af37;
      font-size: 24px;
      font-weight: bold;
    }

    .checkout {
      display: block;
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      background: #d4af37;
      color: #111;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #aaa;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .cart-item {
        align-items: flex-start;
      }

      .cart-item img {
        width: 80px;
        height: 80px;
      }

      .total {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">ELORA</div>
  </header>

  <main class="container">

    <h1>🛒 سبد خرید</h1>

    <div id="cart"></div>

    <div class="total">
      <span>مجموع:</span>
      <span class="total-price" id="total">۰ تومان</span>
    </div>

    <a href="/ELORA-/checkout.html" class="checkout">
      ادامه و ثبت سفارش
    </a>

    <a href="/ELORA-/products.html" class="back">
      ← بازگشت به محصولات
    </a>

  </main>

  <script>
    let cart = JSON.parse(localStorage.getItem("eloraCart")) || [];

    function formatPrice(price) {
      return price.toLocaleString("fa-IR") + " تومان";
    }

    function showCart() {
      const cartBox = document.getElementById("cart");
      const totalBox = document.getElementById("total");

      if (cart.length === 0) {
        cartBox.innerHTML = `
          <div class="empty">
            سبد خرید شما خالی است 🛒
          </div>
        `;

        totalBox.textContent = "۰ تومان";
        return;
      }

      let total = 0;

      cartBox.innerHTML = cart.map((item, index) => {

        total += item.price * item.quantity;

        return `
          <div class="cart-item">

            <img src="${item.image}" alt="${item.name}">

            <div class="item-info">
              <h3>${item.name}</h3>

              <div class="item-price">
                ${formatPrice(item.price)}
              </div>

              <div class="quantity">
                <button onclick="changeQuantity(${index}, 1)">+</button>

                <span>${item.quantity}</span>

                <button onclick="changeQuantity(${index}, -1)">−</button>

                <button class="remove" onclick="removeItem(${index})">
                  حذف
                </button>
              </div>
            </div>

          </div>
        `;

      }).join("");

      totalBox.textContent = formatPrice(total);
    }

    function changeQuantity(index, change) {
      cart[index].quantity += change;

      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }

      saveCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      saveCart();
    }

    function saveCart() {
      localStorage.setItem("eloraCart", JSON.stringify(cart));
      showCart();
    }

    showCart();
  </script>

</body>
  </html>
